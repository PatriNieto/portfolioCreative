<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="blueGradient" cx="50%" cy="50%" r="50%">
      <!-- Centro oscuro -->
      <stop offset="0%" stop-color="#0000ff" />
      <stop offset="30%" stop-color="#3a5175" />
      <!-- Transición al azul medio -->
      <stop offset="50%" stop-color="#4169b3" />
      <!-- Azul más claro -->
      <stop offset="70%" stop-color="#6a8fd8" />
      <!-- Borde muy difuminado -->
      <stop offset="85%" stop-color="#b8c9e8" />
      <stop offset="100%" stop-color="#e8ecf4" />
    </radialGradient>
  </defs>
  
  <!-- Aplicar el degradado -->
  <rect width="100%" height="100%" fill="url(#blueGradient)" />
</svg>