<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
    <!-- Definir el filtro de blur -->
    <defs>
        <filter id="blur">
            <feGaussianBlur in="SourceGraphic" stdDeviation="40"/>
        </filter>
    </defs>
    
    <!-- Elipse 1: Grande y horizontal -->
    <ellipse 
        cx="200" cy="250" 
        rx="300" ry="180" 
        fill="#e8e8e8" 
        opacity="0.5" 
        filter="url(#blur)"
    />
    
    <!-- Elipse 2: Vertical -->
    <ellipse 
        cx="750" cy="700" 
        rx="150" ry="280" 
        fill="#d5d5d5" 
        opacity="0.4" 
        filter="url(#blur)"
    />
    
    <!-- Elipse 3: Pequeña y centrada -->
    <ellipse 
        cx="500" cy="500" 
        rx="200" ry="200" 
        fill="#130070" 
        opacity="0.6" 
        filter="url(#blur)"
    />
</svg>